
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>GeoCapture</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#0b1220;color:#f1f5f9;
  font-family:Arial,sans-serif;
}
.container{max-width:550px;margin:auto}
header{text-align:center;padding:20px}
h1{color:#38bdf8;font-size:30px}
.card{
  background:#172337;padding:18px;
  border-radius:15px;margin-bottom:18px;
  border:1px solid #30415a;
}
button{
  width:100%;padding:14px;margin-top:10px;
  border:0;border-radius:10px;
  background:#0ea5e9;color:white;
  font-size:16px;font-weight:bold;
}
button:disabled{opacity:.4}
.secondary{background:#334155}
video,img{
  width:100%;border-radius:12px;
  margin-top:10px;background:#000;
}
img{display:none}
p{color:#cbd5e1;line-height:1.5}
.status{font-size:14px;color:#7dd3fc;margin-top:10px}
label{display:flex;gap:10px;line-height:1.5}
input{width:20px;height:20px}
.data{
  background:#0b1525;padding:12px;
  margin-top:8px;border-radius:8px;
  overflow-wrap:anywhere;
}
a{color:#7dd3fc}
</style>
</head>

<body>
<div class="container">

<header>
<h1>📍 GeoCapture</h1>
<p>Teste de fotografia e geolocalização</p>
</header>

<div class="card">
<h3>Autorização</h3>
<label>
<input type="checkbox" id="consent">
<span>Autorizo o acesso à câmera e à localização para este teste. Os dados serão exibidos somente nesta página.</span>
</label>
</div>

<div class="card">
<h3>📷 Captura fotográfica</h3>

<video id="video" autoplay playsinline muted></video>
<img id="photo" alt="Fotografia capturada">

<button id="camera" disabled>Ativar câmera</button>
<button id="capture" class="secondary" disabled>Capturar fotografia</button>
<button id="stop" class="secondary" disabled>Desligar câmera</button>

<div id="cameraStatus" class="status">Aguardando autorização.</div>

<a id="download" download="geocapture.jpg" hidden>
<button class="secondary">Baixar fotografia</button>
</a>
</div>

<div class="card">
<h3>🌎 Geolocalização</h3>

<button id="gps" disabled>Obter localização GPS</button>

<div id="gpsStatus" class="status">Aguardando autorização.</div>

<div id="coordinates" hidden>
<div class="data">Latitude: <strong id="lat"></strong></div>
<div class="data">Longitude: <strong id="lon"></strong></div>
<div class="data">Precisão: <strong id="accuracy"></strong></div>
<div class="data">Horário: <strong id="time"></strong></div>

<a id="maps" target="_blank" rel="noopener">
<button class="secondary">Abrir no Google Maps</button>
</a>
</div>
</div>

<div class="card">
<h3>📋 Resultado</h3>
<p id="result">Aguardando fotografia e localização.</p>
<button id="finish" disabled>Concluir teste</button>
</div>

<p style="text-align:center;font-size:12px">
GeoCapture — Protótipo experimental
</p>

</div>

<script>
const $ = id => document.getElementById(id);

let stream = null;
let photoData = null;
let locationData = null;

function update(){
  const authorized = $('consent').checked;

  $('camera').disabled = !authorized || !!stream;
  $('gps').disabled = !authorized;
  $('capture').disabled = !authorized || !stream;
  $('stop').disabled = !stream;
  $('finish').disabled = !authorized || !photoData || !locationData;
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }

  $('video').srcObject=null;
  update();
}

$('consent').addEventListener('change',()=>{
  if(!$('consent').checked){
    stopCamera();
    photoData=null;
    locationData=null;
    $('photo').style.display='none';
    $('download').hidden=true;
    $('coordinates').hidden=true;
    $('result').textContent='Aguardando autorização.';
    $('cameraStatus').textContent='Acesso interrompido.';
    $('gpsStatus').textContent='Aguardando autorização.';
  }
  update();
});

$('camera').onclick=async()=>{
  if(!$('consent').checked)return;

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });

    $('video').srcObject=stream;
    await $('video').play();

    $('cameraStatus').textContent='Câmera ativada.';
  }catch(e){
    $('cameraStatus').textContent='Erro na câmera: '+e.message;
  }

  update();
};

$('capture').onclick=()=>{
  if(!stream)return;

  const video=$('video');
  const canvas=document.createElement('canvas');

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  photoData=canvas.toDataURL('image/jpeg',0.85);

  $('photo').src=photoData;
  $('photo').style.display='block';

  $('download').href=photoData;
  $('download').hidden=false;

  $('cameraStatus').textContent='Fotografia capturada!';
  update();
};

$('stop').onclick=()=>{
  stopCamera();
  $('cameraStatus').textContent='Câmera desligada.';
};

$('gps').onclick=()=>{
  if(!$('consent').checked)return;

  if(!navigator.geolocation){
    $('gpsStatus').textContent='GPS não disponível.';
    return;
  }

  $('gpsStatus').textContent='Obtendo localização...';

  navigator.geolocation.getCurrentPosition(
    position=>{
      locationData=position.coords;

      const latitude=locationData.latitude;
      const longitude=locationData.longitude;

      $('lat').textContent=latitude;
      $('lon').textContent=longitude;

      $('accuracy').textContent=
        '± '+Math.round(locationData.accuracy)+' metros';

      $('time').textContent=
        new Date(position.timestamp).toLocaleString('pt-BR');

      $('maps').href=
        'https://www.google.com/maps?q='+latitude+','+longitude;

      $('coordinates').hidden=false;
      $('gpsStatus').textContent='Localização obtida!';
      update();
    },
    error=>{
      $('gpsStatus').textContent=
        'Não foi possível obter localização: '+error.message;
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
};

$('finish').onclick=()=>{
  if(!photoData || !locationData)return;

  $('result').textContent=
    'Teste concluído! Fotografia capturada e coordenadas obtidas. '+
    'Nenhum dado foi enviado para um servidor.';
};

window.addEventListener('pagehide',stopCamera);

update();
</script>
</body>
</html>
